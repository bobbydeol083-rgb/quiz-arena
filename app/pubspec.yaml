name: quiz_arena
description: QuizArena — a modern, animated, gamified quiz battle app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management / routing (all state via GetX per project spec)
  get: ^4.6.6
  get_storage: ^2.1.1

  # Networking
  http: ^1.2.0
  socket_io_client: ^2.0.3

  # Device
  geolocator: ^12.0.0

  # UI / animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  dotted_border: ^2.1.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  flutter_svg: ^2.0.10
  lottie: ^3.1.3
  scratcher: ^2.2.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/questions.json
    - assets/true_false.json
    - assets/elite/
